[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aseprite-mcp-server"
version = "0.1.0"
description = "A safe, local Model Context Protocol server for Aseprite"
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{ name = "MCP Servers contributors" }]
dependencies = [
  "mcp[cli]>=2.3,<3",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
aseprite-mcp = "aseprite.__main__:main"

[tool.hatch.build.targets.wheel]
# The project directory is also the source package; prefix its files in the wheel.
only-include = [
  "__init__.py", "__main__.py", "adapter.py", "capabilities.py", "config.py",
  "errors.py", "interop.py", "models.py", "paths.py", "process_runner.py",
  "server.py", "schemas", "services", "tools", "scripts",
]
sources = { "" = "aseprite" }
# In a source checkout the parent contains the importable aseprite/ package.
dev-mode-dirs = [".."]

[tool.hatch.build.targets.sdist]
include = ["/*.py", "/schemas", "/services", "/tools", "/scripts", "/skills",
  "/tests", "/README.md", "/pyproject.toml", "/uv.lock"]

[tool.ruff]
extend-exclude = [".python", ".tools", ".venv"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aseprite"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["aseprite"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a configured Aseprite executable"]
